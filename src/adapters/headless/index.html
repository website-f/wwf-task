<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scroll Map — headless adapter</title>

<!--
  ══════════════════════════════════════════════════════════════════════════
  HEADLESS / ANY-CMS ADAPTER

  This is the whole integration. There is no server-side template anywhere:
  the page fetches JSON that matches ../../core/scrollmap.schema.json and the
  webpart renders itself from it.

  That JSON can come from anything — Contentful, Strapi, Sanity, Directus,
  Prismic, a SharePoint list, a REST endpoint, a headless WordPress via
  /wp-json, or a flat file like the one here. The webpart does not know or
  care; it only knows the schema.

  Three tags is the entire install:
      <link rel="stylesheet" href="core/scrollmap.css">
      <script src="core/vendor/gsap.min.js"></script>          (+ ScrollTrigger)
      <script src="core/scrollmap-render.js"></script>
      <script src="core/scrollmap.js"></script>

  …and one element carrying the content:
      <div data-tgr-src="#content"></div>   with the JSON in a <script type="application/json">
      <div data-tgr-json='{ … }'></div>     inline, for a single small instance

  ⚠ SANITISATION. The renderer strips anything outside p/br/em/strong/u/a and
  rejects non-http(s) hrefs, but that is defence in depth, not the boundary.
  Sanitise rich text in your CMS, on save, server-side. See core/README.md.
  ══════════════════════════════════════════════════════════════════════════
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../core/scrollmap.css">

<style>
  /* Host-page chrome. In a real site your theme owns all of this. */
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: #04140d; color: #f2efe6;
         font-family: "Open Sans", system-ui, "Segoe UI", Arial, sans-serif; }
  @font-face { font-family: "WWF"; src: url("../../standalone/assets/wwf.woff") format("woff");
               font-weight: 100 900; font-display: swap; }
  .band { min-height: 52vh; display: grid; place-content: center; text-align: center;
          padding: 10vh 24px; gap: 12px;
          background: radial-gradient(120% 100% at 50% 0%, #0d3a24 0%, #04140d 70%); }
  .band h1 { font-family: "WWF", "Arial Narrow", sans-serif; font-weight: 400;
             text-transform: uppercase; font-size: clamp(2rem, 6vw, 3.6rem);
             line-height: .95; margin: 0; }
  .band p { margin: 0; opacity: .66; font-size: .9rem; max-width: 46ch; }
  .band code { background: rgba(255,255,255,.08); padding: 2px 7px; border-radius: 5px; }
  .kicker { letter-spacing: .3em; text-transform: uppercase; font-size: 11px; opacity: .55; }
  #status { font-size: .82rem; opacity: .6; }
</style>
</head>
<body>

<header class="band">
  <p class="kicker">Adapter · headless</p>
  <h1>No CMS required</h1>
  <p>The same webpart as the WordPress block and the standalone demo — rendered
     in the browser from <code>content.json</code>, with no server-side template.</p>
  <p id="status">loading content…</p>
</header>


<!-- The content is fetched and dropped in here as a JSON script tag, then the
     engine renders and boots it. Nothing else on the page knows what a hotspot
     is. -->
<div id="slot"></div>


<footer class="band">
  <h1>Same core</h1>
  <p>Swap <code>content.json</code> for your CMS's API response and this page is
     your integration.</p>
</footer>

<script src="../../core/vendor/gsap.min.js"></script>
<script src="../../core/vendor/ScrollTrigger.min.js"></script>
<script src="../../core/scrollmap-render.js"></script>

<script>
  /* Fetch the content, then hand it to the webpart. In a framework this is a
     data loader; in a static-site build it happens at build time instead and
     the HTML ships pre-rendered — same renderer either way. */
  fetch('content.json')
    .then(function (r) { return r.json(); })
    .then(function (content) {
      var check = ScrollMapRender.validate(content);
      document.getElementById('status').textContent = check.ok
        ? '✓ content valid · ' + content.hotspots.length + ' hotspots · rendered in the browser'
        : '✗ ' + check.errors.join(' ');
      if (check.warnings.length) console.warn('[scrollmap]', check.warnings);

      /* Either put the JSON in a script tag and let the engine find it… */
      var json = document.createElement('script');
      json.type = 'application/json';
      json.id = 'content';
      json.textContent = JSON.stringify(content);
      document.body.appendChild(json);
      document.getElementById('slot').outerHTML = '<div data-tgr-src="#content"></div>';

      /* …then load the engine, which hydrates every slot it finds and boots. */
      var s = document.createElement('script');
      s.src = '../../core/scrollmap.js';
      document.body.appendChild(s);
    })
    .catch(function (e) {
      document.getElementById('status').textContent = 'could not load content.json — ' + e.message;
    });
</script>
</body>
</html>
